worker_processes  auto;

# The container runs as an unprivileged, fixed uid (nginx-unprivileged
# image) so there is no "user" directive / no root->uid switch to do.
# Log to stdout/stderr and keep all writable paths under /tmp (tmpfs) so
# the container root filesystem can stay read-only.
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    # Writable scratch space for nginx (proxy/client-body/fastcgi/uwsgi/scgi
    # temp buffers) lives on the /tmp tmpfs mount, since the container root
    # filesystem is read-only. proxy_buffering/proxy_request_buffering are
    # off below, so these paths are rarely, if ever, actually used.
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Allow unlimited upload size
    client_max_body_size 0;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'upstream_addr=$upstream_addr '
                      'upstream_status=$upstream_status '
                      'upstream_response_time=$upstream_response_time '
                      'upstream_connect_time=$upstream_connect_time';

    # Log to stdout/stderr (captured by the json-file logging driver with
    # rotation) instead of /var/log/nginx, which is not writable on a
    # read-only root filesystem.
    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 10s;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    # Cap concurrent connections per client IP to protect worker_connections
    # from exhaustion (large file transfers hold connections open for a
    # long time with proxy_buffering off).
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream app_backend {
        # Adjust service config here!
        server copyparty:3923 max_fails=3 fail_timeout=10s;

        keepalive 16;
        keepalive_timeout 30s;
        keepalive_requests 100;
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # NOTE: $server_port here is nginx's *internal* listen port (8443),
        # not the host-published NGINX_PORT from .env. If NGINX_PORT is
        # changed to something other than 8443, a client that mistakenly
        # sends plain HTTP to the HTTPS port will be redirected to the
        # internal port number, which is only reachable externally if
        # NGINX_PORT is mapped 1:1 to 8443.
        error_page 497 =301 https://$host:$server_port$request_uri;

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;

            # Send only the real client IP in X-Forwarded-For
            # (matches copyparty's "best/safest approach" when used with rproxy=1)
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Optional but recommended: forward the external host as X-Forwarded-Host
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Connection "";

            # Stream uploads/downloads without buffering
            proxy_request_buffering off;
            proxy_buffering off;

            # Allow long downloads
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_timeout 30s;
            proxy_next_upstream_tries 3;

            proxy_connect_timeout 10s;

            proxy_intercept_errors on;
            proxy_ignore_client_abort off;
        }

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

}