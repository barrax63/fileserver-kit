name: fileserver-kit

networks:
  main:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-security-baseline: &security-baseline
  security_opt:
    - no-new-privileges:true
    - apparmor=docker-default
  cap_drop:
    - ALL

services:
  copyparty:
    <<: *security-baseline
    image: copyparty/ac:latest
    hostname: copyparty
    networks: ['main']
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    tmpfs:
      # copyparty spools small temp files (upload-queue snapshots, thumbnail
      # extraction) via Python's tempfile module. Actual uploaded file data
      # is written straight to the /w volume, never to /tmp.
      - /tmp:size=256m,mode=1777,uid=1000,gid=1000
    environment:
      - LD_PRELOAD=/usr/lib/libmimalloc-secure.so.2
    volumes:
      # NOTE: intentionally NOT read-only. copyparty persists an
      # auto-generated salt (ah-salt/fk-salt/dk-salt, used for filekeys and
      # dirkeys on shared links) under $XDG_CONFIG_HOME (=/cfg). Making this
      # read-only causes the salt to regenerate on every restart, which
      # silently invalidates existing shared links.
      - ./config:/cfg
      - /mnt/hdd:/w
    cap_add:
      # CHOWN/FOWNER/DAC_OVERRIDE: copyparty runs as an unprivileged uid
      # (1000) but may need to read/chown/chmod files on the bind-mounted
      # /mnt/hdd that were created by a different uid on the host (common
      # for NAS-style shares), and supports an optional per-volume
      # uid/gid-normalization feature (os.chown) for uploaded files.
      # If /mnt/hdd is guaranteed to be entirely owned by uid:gid 1000:1000
      # on the host, DAC_OVERRIDE/CHOWN/FOWNER can be trimmed further.
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      # SETUID/SETGID intentionally dropped: copyparty never calls
      # setuid()/setgid() when it is already started as a fixed non-root
      # user (no privilege-drop-from-root code path is exercised here).
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:3923/?reset=/._"]
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 15s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  nginx:
    <<: *security-baseline
    # Unprivileged variant of the official image: the master process runs
    # as uid 101 from the start (no root startup + setuid drop), which
    # means no capabilities need to be added at all - listen port 8443 is
    # >1024 so CAP_NET_BIND_SERVICE isn't required either.
    image: nginxinc/nginx-unprivileged:stable-alpine
    hostname: nginx
    networks: ['main']
    ports:
      - "${NGINX_PORT:-8443}:8443"
    restart: unless-stopped
    init: true
    user: "101:101"
    read_only: true
    tmpfs:
      # nginx.conf points pid/client-body/proxy/fastcgi/uwsgi/scgi temp
      # paths at /tmp (see nginx/nginx.conf); logs go to stdout/stderr.
      - /tmp:size=64m,mode=1777,uid=101,gid=101
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      copyparty:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

    logging: *default-logging




